name: Build LinkedIn Poster

# Seller-only tool - builds 3SVerse LinkedIn Poster as a SINGLE .exe
# (Nuitka --onefile) and attaches the exe itself to a release in this
# PRIVATE repo. No zip folder — the release asset IS the runnable exe.
# NOTE: a onefile exe self-extracts into a cache dir at runtime, which
# some antivirus static AI can flag; users may see a SmartScreen prompt
# (More info → Run anyway) on first launch. Documented in README.
# Developed by www.3SVerse.com (c) 2026

on:
  push:
    branches: [main]
    paths: ["linkedin_poster.py", "branding_runtime.py", "brand_bg_*.png", "3sverse_icon.ico", ".github/workflows/build-poster.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Single source of truth: VERSION in linkedin_poster.py drives the
      # exe metadata AND the release tag.
      - name: Read version from linkedin_poster.py
        shell: pwsh
        run: |
          $v = (Select-String -Path linkedin_poster.py -Pattern 'VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          echo "VERSION=$v" >> $env:GITHUB_ENV
          echo "building LinkedIn Poster $v"

      - name: Install build deps
        run: python -m pip install nuitka

      - name: Build with Nuitka (onefile - single portable exe)
        shell: cmd
        run: >
          python -m nuitka --onefile --assume-yes-for-downloads
          --enable-plugin=tk-inter
          --windows-console-mode=disable
          --windows-icon-from-ico=3sverse_icon.ico
          --company-name="3S Verse"
          --product-name="3SVerse LinkedIn Poster"
          --file-version="${{ env.VERSION }}.0" --product-version="${{ env.VERSION }}.0"
          --file-description="3SVerse LinkedIn Poster (campaign scheduler + publisher)"
          --onefile-tempdir-spec="%CACHE_DIR%/{PRODUCT}/{VERSION}"
          --python-flag=no_asserts,no_docstrings
          --include-data-file=3sverse_icon.ico=3sverse_icon.ico
          --include-data-file=3sverse_logo_header.png=3sverse_logo_header.png
          --include-data-file=bg_ring.png=bg_ring.png
          --include-data-file=bg_orb.png=bg_orb.png
          --include-data-file=brand_bg_ring.png=brand_bg_ring.png
          --include-data-file=brand_bg_orb.png=brand_bg_orb.png
          --output-dir=dist linkedin_poster.py

      - name: Rename exe
        shell: pwsh
        run: |
          Move-Item dist\linkedin_poster.exe dist\3SVerse_LinkedIn_Poster.exe -Force
          (Get-Item dist\3SVerse_LinkedIn_Poster.exe).Length

      # NOTE: no actions/upload-artifact here - artifact storage quota
      # would block the build. Release assets do NOT count against it.

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: poster-v${{ env.VERSION }}
          name: 3SVerse LinkedIn Poster ${{ env.VERSION }}
          files: |
            dist/3SVerse_LinkedIn_Poster.exe
